<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#010302" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Asymmantics" />
<meta name="author" content="Tommy Burke / KGB Arcade" />
<meta name="copyright" content="Copyright © 2026 Tommy Burke / KGB Arcade. All rights reserved." />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<title>Asymmantics — Beta 0.2.2</title>
<style>
  :root{
    --bg:#010302;
    --panel:#041008;
    --panel-2:#06130a;
    --line:#14371d;
    --line-soft:#0d2514;
    --source:#67ff8f;
    --source-dim:#285d35;
    --player:#ffc96b;
    --player-dim:#66512b;
    --text:#c8ffd4;
    --muted:#4f7758;
    --selected:#d9ffe2;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    background:radial-gradient(circle at 50% 10%,#0a180e 0%,var(--bg) 64%,#000 100%);
    color:var(--text);font-family:"Courier New",monospace
  }

  button,input{font:inherit}
  button{touch-action:manipulation}

  .app{
    width:min(980px,100%);
    height:100dvh;
    margin:0 auto;
    padding:7px;
    display:grid;
    grid-template-rows:auto auto minmax(0,1fr) auto auto;
    gap:7px
  }

  .topbar{
    border:1px solid var(--line);
    background:rgba(1,7,3,.94);
    padding:9px 11px;
    color:var(--muted);
    letter-spacing:.15em;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px
  }

  .brand{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status-mark{color:var(--source)}
  .top-actions{display:flex;gap:7px;align-items:center}

  .icon-btn,.install-btn{
    min-width:40px;height:34px;
    border:1px solid var(--source-dim);
    background:#06130a;
    color:var(--source);
    cursor:pointer;
    letter-spacing:.08em
  }

  .install-btn{display:none;padding:0 10px}
  .install-btn.show{display:block}

  .scope{
    height:104px;
    border:1px solid var(--line);
    background:
      linear-gradient(rgba(103,255,143,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(103,255,143,.018) 1px,transparent 1px),
      #020704;
    background-size:18px 18px;
    overflow:hidden;
    position:relative;
    cursor:pointer
  }

  canvas{display:block;width:100%;height:104px}

  .scope-origin{
    position:absolute;
    top:7px;right:9px;
    font-size:10px;
    letter-spacing:.18em;
    color:var(--muted);
    pointer-events:none
  }

  .scope-origin.source{color:var(--source)}
  .scope-origin.player{color:var(--player)}

  .ledger{
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    border:1px solid var(--line);
    background:rgba(1,7,3,.91);
    padding:12px 9px 20px;
    display:flex;
    flex-direction:column;
    gap:16px;
    scroll-behavior:smooth;
    position:relative
  }

  .bundle{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:7px 5px;
    border-left:1px solid var(--line-soft)
  }

  .bundle + .bundle{margin-top:5px}
  .bundle.challenge-set{border-left-color:var(--source-dim)}

  .entry{display:flex;width:100%}
  .entry.source{justify-content:flex-start}
  .entry.player{justify-content:flex-end}

  .bubble{
    width:min(78%,650px);
    padding:9px 11px;
    min-height:50px;
    border:1px solid;
    background:#031008;
    cursor:pointer;
    transition:border-color .12s, background .12s, opacity .12s
  }

  .source .bubble{
    border-color:var(--source-dim);
    border-left:3px solid var(--source)
  }

  .player .bubble{
    border-color:var(--player-dim);
    border-right:3px solid var(--player);
    background:#100d05
  }

  .bubble.selected{
    border-color:var(--selected);
    background:#09170d
  }

  .player .bubble.selected{
    border-color:#ffe1a2;
    background:#171106
  }

  .bubble.context-member::after{
    content:"";
    display:block;
    width:22%;
    height:1px;
    margin-top:7px;
    background:currentColor;
    opacity:.16
  }

  .signal-line{
    min-height:32px;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:0
  }

  .cell{
    width:22px;height:32px;
    position:relative;
    flex:0 0 22px
  }

  .cell.high::before,.cell.low::before{
    content:"";
    position:absolute;
    left:2px;
    width:18px;height:5px;
    border-radius:1px
  }

  .source .cell.high::before,.source .cell.low::before,
  .context-source .cell.high::before,.context-source .cell.low::before{
    background:var(--source);
    box-shadow:0 0 8px rgba(103,255,143,.28)
  }

  .player .cell.high::before,.player .cell.low::before,
  .context-player .cell.high::before,.context-player .cell.low::before{
    background:var(--player);
    box-shadow:0 0 8px rgba(255,201,107,.22)
  }

  .cell.high::before{top:4px}
  .cell.low::before{bottom:4px}

  .cell.high::after,.cell.low::after{
    content:"";
    position:absolute;
    left:10px;
    width:1px;height:19px;
    opacity:.30
  }

  .source .cell.high::after,.source .cell.low::after,
  .context-source .cell.high::after,.context-source .cell.low::after{
    background:var(--source)
  }

  .player .cell.high::after,.player .cell.low::after,
  .context-player .cell.high::after,.context-player .cell.low::after{
    background:var(--player)
  }

  .cell.high::after{top:9px}
  .cell.low::after{bottom:9px}
  .cell.off{width:25px;flex-basis:25px}

  .incoming{
    position:absolute;
    right:12px;bottom:10px;
    width:12px;height:12px;
    border-radius:50%;
    background:var(--source);
    box-shadow:0 0 12px rgba(103,255,143,.45);
    display:none;
    cursor:pointer
  }

  .incoming.show{display:block}

  .context-rack{
    min-height:68px;
    max-height:132px;
    overflow-y:auto;
    border:1px solid var(--line);
    background:rgba(2,10,5,.96);
    padding:7px;
    display:grid;
    grid-template-columns:1fr;
    gap:6px
  }

  .context-rack.empty{display:none}

  .context-item{
    min-height:52px;
    border:1px solid var(--line-soft);
    background:#031008;
    padding:6px;
    cursor:pointer;
    overflow:hidden
  }

  .context-item.current{
    border-color:var(--source-dim)
  }

  .context-item.selected{
    border-color:var(--selected)
  }

  .context-item .signal-line{
    transform:scale(.78);
    transform-origin:left center;
    width:128%
  }

  .composer{
    border:1px solid var(--line);
    background:rgba(1,7,3,.97);
    padding:9px;
    display:grid;
    gap:8px
  }

  .strip{
    display:grid;
    grid-template-columns:repeat(12,minmax(0,1fr));
    gap:5px
  }

  .sigbtn{
    height:47px;
    border:1px solid #234a2c;
    background:#041008;
    color:var(--source);
    position:relative;
    cursor:pointer
  }

  .sigbtn::before{
    content:"";
    position:absolute;
    left:14%;right:14%;
    height:5px;border-radius:1px;
    opacity:0
  }

  .sigbtn.high::before{
    top:8px;opacity:1;
    background:var(--player);
    box-shadow:0 0 8px rgba(255,201,107,.22)
  }

  .sigbtn.low::before{
    bottom:8px;opacity:1;
    background:var(--player);
    box-shadow:0 0 8px rgba(255,201,107,.22)
  }

  .sigbtn.high::after,.sigbtn.low::after{
    content:"";
    position:absolute;
    left:50%;
    width:1px;height:22px;
    background:var(--player);
    opacity:.28
  }

  .sigbtn.high::after{top:13px}
  .sigbtn.low::after{bottom:13px}

  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px
  }

  .btn{
    border:1px solid #2a5734;
    background:#07140b;
    color:var(--text);
    padding:10px;
    cursor:pointer;
    letter-spacing:.12em
  }

  .btn.primary{
    border-color:#5f512a;
    color:var(--player);
    background:#171106
  }

  .drawer{
    position:fixed;
    inset:0 0 0 auto;
    z-index:25;
    width:min(390px,92vw);
    background:#020704;
    border-left:1px solid var(--line);
    transform:translateX(102%);
    transition:transform .18s ease;
    display:grid;
    grid-template-rows:auto auto minmax(0,1fr);
    padding:12px;
    gap:10px
  }

  .drawer.open{transform:translateX(0)}
  .drawer-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--muted);
    letter-spacing:.14em;
    font-size:12px
  }

  .notebook-form{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:7px
  }

  .notebook-form input{
    width:100%;
    border:1px solid var(--line);
    background:#041008;
    color:var(--text);
    padding:9px
  }

  .notes{
    min-height:0;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px
  }

  .note{
    border:1px solid var(--line);
    padding:8px;
    background:#031008;
    cursor:pointer
  }

  .note-title{
    color:var(--text);
    margin-bottom:5px;
    overflow-wrap:anywhere
  }

  .note .signal-line{
    transform:scale(.82);
    transform-origin:left center;
    width:122%
  }

  .overlay{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    place-items:center;
    padding:20px;
    background:#010301
  }

  .overlay.show{display:grid}
  .reveal{width:min(700px,100%);text-align:center}

  .entities{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:24px
  }

  .entity{
    height:112px;
    border:1px solid #294a31;
    display:grid;
    place-items:center;
    position:relative
  }

  .entity::before{
    content:"";
    width:18px;height:18px;
    border:2px solid var(--source);
    border-radius:50%;
    box-shadow:0 0 12px rgba(103,255,143,.35)
  }

  .entity.you{border-color:var(--player-dim)}

  .entity.you::before{
    border-color:var(--player);
    box-shadow:0 0 12px rgba(255,201,107,.28)
  }

  .entity.you::after{
    content:"";
    position:absolute;
    bottom:10px;
    width:44%;height:2px;
    background:var(--player)
  }

  .reveal-signal{
    display:flex;
    justify-content:center;
    margin:18px 0
  }

  .mark{
    margin-top:18px;
    color:var(--source);
    font-size:clamp(42px,10vw,92px);
    letter-spacing:.16em
  }

  .sub{
    margin-top:12px;
    color:var(--muted);
    letter-spacing:.14em;
    font-size:12px
  }

  @media(max-width:650px){
    .app{padding:4px;gap:4px}
    .scope{height:76px}
    canvas{height:76px}
    .ledger{padding:8px 5px 16px;gap:12px}
    .bubble{width:90%;padding:8px 9px}
    .context-rack{
      min-height:58px;
      max-height:108px;
      grid-template-columns:1fr
    }
    .strip{gap:3px}
    .sigbtn{height:41px}
    .cell{width:18px;flex-basis:18px}
    .cell.off{width:21px;flex-basis:21px}
    .cell.high::before,.cell.low::before{width:14px;left:2px}
    .topbar{font-size:10px}
    .icon-btn,.install-btn{height:30px;min-width:36px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">ASYMMANTICS // BETA 0.2.2 <span class="status-mark" id="stateMark">•</span></div>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="notebookBtn" aria-label="Open signal notebook">▤</button>
      <button type="button" class="install-btn" id="installBtn">INSTALL</button>
    </div>
  </header>

  <section class="scope" id="scopePanel" aria-label="Selected signal scope">
    <canvas id="scope" width="960" height="104"></canvas>
    <div class="scope-origin" id="scopeOrigin">—</div>
  </section>

  <main class="ledger" id="ledger" aria-live="polite">
    <button type="button" class="incoming" id="incomingBtn" aria-label="Jump to newest transmission"></button>
  </main>

  <section class="context-rack empty" id="contextRack" aria-label="Active transmissions"></section>

  <section class="composer">
    <div class="strip" id="strip"></div>
    <div class="controls">
      <button type="button" class="btn" id="clearBtn">CLEAR</button>
      <button type="button" class="btn primary" id="sendBtn">TRANSMIT</button>
    </div>
  </section>
</div>

<aside class="drawer" id="notebook">
  <div class="drawer-header">
    <span>SIGNAL RECORD</span>
    <button type="button" class="icon-btn" id="closeNotebook" aria-label="Close signal notebook">×</button>
  </div>
  <div class="notebook-form">
    <input id="noteInput" maxlength="60" autocomplete="off" placeholder="your notation" aria-label="Your notation for selected signal" />
    <button type="button" class="btn" id="saveNoteBtn">SAVE</button>
  </div>
  <div class="notes" id="notes"></div>
</aside>

<div class="overlay" id="overlay">
  <div class="reveal">
    <div class="entities">
      <div class="entity"></div>
      <div class="entity"></div>
      <div class="entity you"></div>
    </div>
    <div class="reveal-signal" id="remembered"></div>
    <div class="mark">ASYMMANTICS</div>
    <div class="sub">PRESENCE ESTABLISHED</div>
    <button type="button" class="btn primary" id="restartBtn" style="margin-top:24px">RESTART</button>
  </div>
</div>

<script>
(() => {
  const O=0,H=1,L=-1;
  const SAME=[H,L,H];
  const DIFFERENT=[L,H,L];

  const ledger=document.getElementById('ledger');
  const contextRack=document.getElementById('contextRack');
  const strip=document.getElementById('strip');
  const clearBtn=document.getElementById('clearBtn');
  const sendBtn=document.getElementById('sendBtn');
  const overlay=document.getElementById('overlay');
  const remembered=document.getElementById('remembered');
  const stateMark=document.getElementById('stateMark');
  const canvas=document.getElementById('scope');
  const ctx=canvas.getContext('2d');
  const scopePanel=document.getElementById('scopePanel');
  const scopeOrigin=document.getElementById('scopeOrigin');
  const incomingBtn=document.getElementById('incomingBtn');
  const notebook=document.getElementById('notebook');
  const notesEl=document.getElementById('notes');
  const noteInput=document.getElementById('noteInput');

  const state={
    compose:Array(12).fill(O),
    step:0,
    failures:0,
    signature:[],
    transmissions:[],
    selectedId:null,
    contextIds:[],
    conceptContexts:{},
    notes:[],
    autoScroll:true,
    playing:false
  };

  function groups(...gs){
    const out=[];
    gs.forEach((g,i)=>{
      out.push(...g);
      if(i<gs.length-1)out.push(O,O);
    });
    return out;
  }

  const lesson={
    relationExamples:[
      groups([H,L,H],[H,L,H],SAME),
      groups([L,L,H],[L,L,H],SAME),
      groups([H,L,H],[L,H,H],DIFFERENT),
      groups([L,H,H],[H,L,H],DIFFERENT)
    ],
    relationContrast:groups([H,O,L],[H,L,O],DIFFERENT)
  };

  const tasks=[
    {
      kind:'progress',
      prompt:groups([H],[H,H],[H,H,H]),
      answer:[H,H,H,H],
      context:'prompt',
      remediation:[
        groups([H],[H,H],[H,H,H]),
        groups([H],[H,H],[H,H,H],[H,H,H,H])
      ]
    },
    {
      kind:'progress',
      prompt:groups([L,L],[L,L,L],[L,L,L,L]),
      answer:[L,L,L,L,L],
      context:'prompt',
      remediation:[
        groups([L,L],[L,L,L],[L,L,L,L]),
        groups([L],[L,L],[L,L,L],[L,L,L,L])
      ]
    },
    {
      kind:'progress',
      prompt:groups([H,L],[H,L,H,L],[H,L,H,L,H,L]),
      answer:[H,L,H,L,H,L,H,L],
      context:'prompt',
      remediation:[
        groups([H,L],[H,L,H,L],[H,L,H,L,H,L]),
        groups([H,L],[H,L,H,L],[H,L,H,L,H,L],[H,L,H,L,H,L,H,L])
      ]
    },
    {
      kind:'echo',
      prompt:[H,L,H,H,L,H],
      answer:[H,L,H,H,L,H],
      context:'prompt'
    },
    {
      kind:'echo',
      prompt:[L,H,O,H,L,H,O,L],
      answer:[L,H,O,H,L,H,O,L],
      context:'prompt'
    },
    {
      kind:'lessonBundle',
      concept:'relation',
      demonstrations:lesson.relationExamples
    },
    {
      kind:'relation',
      concept:'relation',
      prompt:groups([H,H,L,H],[H,H,L,H]),
      answer:SAME,
      context:'relation',
      remediation:[lesson.relationContrast]
    },
    {
      kind:'relation',
      concept:'relation',
      prompt:groups([H,H,L],[H,L,H]),
      answer:DIFFERENT,
      context:'relation',
      remediation:[lesson.relationContrast]
    },
    {
      kind:'relation',
      concept:'relation',
      prompt:groups([H,O,L,H],[H,O,L,H]),
      answer:SAME,
      context:'relation',
      remediation:[lesson.relationContrast]
    },
    {
      kind:'progress',
      prompt:groups([L],[L,L],[L,L,L],[L,L,L,L]),
      answer:[L,L,L,L,L],
      context:'prompt'
    },
    {
      kind:'echo',
      prompt:[H,O,L,L,H,O,H,L],
      answer:[H,O,L,L,H,O,H,L],
      context:'prompt'
    },
    {
      kind:'relation',
      concept:'relation',
      prompt:groups([L,H,O,L],[L,H,L,O]),
      answer:DIFFERENT,
      context:'relation',
      remediation:[lesson.relationContrast]
    },
    {
      kind:'open',
      prompt:[H,H,H,L,L,L,H,H,H],
      context:'prompt'
    }
  ];

  function trim(a){
    let e=a.length;
    while(e>0&&a[e-1]===O)e--;
    return a.slice(0,e)
  }

  function same(a,b){
    const x=trim(a),y=trim(b);
    return x.length===y.length&&x.every((v,i)=>v===y[i])
  }

  function currentTask(){return tasks[state.step]}

  function signalDOM(signal,side='source'){
    const line=document.createElement('div');
    line.className='signal-line';
    signal.forEach(v=>{
      const cell=document.createElement('span');
      cell.className='cell '+(v===H?'high':v===L?'low':'off');
      line.appendChild(cell)
    });
    return line
  }

  function transmissionById(id){
    return state.transmissions.find(t=>t.id===id)||null
  }

  function addTransmission(side,signal,{bundleId=null,context=false,current=false}={}){
    const id='t'+(state.transmissions.length+1);
    const tx={id,side,signal:signal.slice(),bundleId};
    state.transmissions.push(tx);

    let bundle=bundleId?ledger.querySelector(`[data-bundle="${bundleId}"]`):null;
    if(!bundle){
      bundle=document.createElement('section');
      bundle.className='bundle'+(bundleId?' challenge-set':'');
      if(bundleId)bundle.dataset.bundle=bundleId;
      ledger.insertBefore(bundle,incomingBtn)
    }

    const row=document.createElement('div');
    row.className='entry '+side;
    row.dataset.tx=id;

    const bubble=document.createElement('button');
    bubble.type='button';
    bubble.className='bubble'+(context?' context-member':'');
    bubble.appendChild(signalDOM(signal,side));
    bubble.addEventListener('click',()=>selectTransmission(id,true));

    row.appendChild(bubble);
    bundle.appendChild(row);

    if(context){
      state.contextIds.push(id);
      if(current)state.currentContextId=id;
      renderContext()
    }

    if(state.autoScroll){
      requestAnimationFrame(()=>ledger.scrollTop=ledger.scrollHeight)
    }else{
      incomingBtn.classList.add('show')
    }

    selectTransmission(id,true);
    return id
  }

  function selectTransmission(id,replay=false){
    const tx=transmissionById(id);
    if(!tx)return;

    state.selectedId=id;

    document.querySelectorAll('.bubble.selected').forEach(el=>el.classList.remove('selected'));
    const row=ledger.querySelector(`[data-tx="${id}"] .bubble`);
    if(row)row.classList.add('selected');

    document.querySelectorAll('.context-item.selected').forEach(el=>el.classList.remove('selected'));
    const contextEl=contextRack.querySelector(`[data-context-tx="${id}"]`);
    if(contextEl)contextEl.classList.add('selected');

    scopeOrigin.textContent=tx.side==='source'?'RECEIVED':'TRANSMITTED';
    scopeOrigin.className='scope-origin '+tx.side;
    drawWave(tx.signal,tx.side,replay)
  }

  function renderContext(){
    contextRack.innerHTML='';
    const unique=[...new Set(state.contextIds)].filter(id=>transmissionById(id));
    contextRack.classList.toggle('empty',unique.length===0);

    unique.forEach(id=>{
      const tx=transmissionById(id);
      const item=document.createElement('button');
      item.type='button';
      item.className='context-item context-'+tx.side+
        (id===state.currentContextId?' current':'')+
        (id===state.selectedId?' selected':'');
      item.dataset.contextTx=id;
      item.appendChild(signalDOM(tx.signal,tx.side));
      item.addEventListener('click',()=>selectTransmission(id,true));
      contextRack.appendChild(item)
    })
  }

  function clearContext(){
    state.contextIds=[];
    state.currentContextId=null;
    renderContext()
  }

  function restoreConceptContext(concept){
    if(!concept)return;
    const saved=state.conceptContexts[concept]||[];
    state.contextIds.push(...saved.filter(id=>transmissionById(id)));
  }

  function renderComposer(){
    strip.innerHTML='';
    state.compose.forEach((v,i)=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='sigbtn '+(v===H?'high':v===L?'low':'off');
      b.setAttribute('aria-label','Signal position '+(i+1));
      b.addEventListener('click',()=>{
        state.compose[i]=v===O?H:v===H?L:O;
        renderComposer()
      });
      strip.appendChild(b)
    })
  }

  function clearComposer(){
    state.compose=Array(12).fill(O);
    renderComposer()
  }

  function drawNoise(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const mid=canvas.height/2;
    ctx.strokeStyle='rgba(103,255,143,.22)';
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=0;x<canvas.width;x+=3){
      const y=mid+Math.sin(x*.045)*2+(Math.random()-.5)*9;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)
    }
    ctx.stroke()
  }

  function drawWave(signal,side,replay=false){
    const sig=signal.length?signal:[O];
    const color=side==='source'?'rgba(103,255,143,.88)':'rgba(255,201,107,.88)';
    const pad=20,mid=canvas.height/2,amp=canvas.height*.27;
    const step=(canvas.width-pad*2)/Math.max(sig.length,1);

    function paint(progress=1){
      ctx.clearRect(0,0,canvas.width,canvas.height);

      ctx.strokeStyle='rgba(103,255,143,.08)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(0,mid);ctx.lineTo(canvas.width,mid);ctx.stroke();

      ctx.strokeStyle=color;
      ctx.lineWidth=2;
      ctx.beginPath();

      let x=pad,y=mid;
      ctx.moveTo(x,y);
      const visible=Math.max(0,Math.min(sig.length,Math.ceil(sig.length*progress)));

      sig.slice(0,visible).forEach((v,i)=>{
        const target=v===H?mid-amp:v===L?mid+amp:mid;
        const nx=pad+(i+1)*step;
        ctx.lineTo(x,target);
        ctx.lineTo(nx,target);
        x=nx;y=target
      });

      if(visible===sig.length)ctx.lineTo(canvas.width-pad,mid);
      ctx.stroke()
    }

    if(!replay){
      paint(1);
      return
    }

    const start=performance.now();
    const duration=Math.max(500,sig.length*100);
    state.playing=true;

    function frame(now){
      const p=Math.min(1,(now-start)/duration);
      paint(p);
      if(p<1)requestAnimationFrame(frame);
      else state.playing=false
    }

    requestAnimationFrame(frame)
  }

  function pulseError(){
    stateMark.textContent='••';
    setTimeout(()=>stateMark.textContent='•',430)
  }

  function presentTask(){
    const task=currentTask();
    if(!task)return;

    state.failures=0;
    clearContext();

    if(task.kind==='lessonBundle'){
      const bundleId='lesson-'+state.step;
      const lessonIds=[];
      task.demonstrations.forEach(sig=>{
        const id=addTransmission('source',sig,{bundleId,context:true});
        lessonIds.push(id)
      });
      if(task.concept)state.conceptContexts[task.concept]=lessonIds.slice();

      setTimeout(()=>{
        state.step++;
        presentTask()
      },1350);
      return
    }

    restoreConceptContext(task.concept);
    const id=addTransmission('source',task.prompt,{context:true,current:true});
    state.currentContextId=id;
    renderContext()
  }

  function correctResponse(sent){
    addTransmission('source',sent);
    state.step++;
    setTimeout(presentTask,850)
  }

  function remediation(task){
    state.failures++;
    pulseError();

    if(state.failures===1){
      addTransmission('source',task.prompt,{context:false,current:false});
      return
    }

    if(state.failures===2){
      const replayIds=[...state.contextIds];
      replayIds.forEach((id,index)=>{
        const tx=transmissionById(id);
        if(!tx)return;
        setTimeout(()=>{
          addTransmission('source',tx.signal,{bundleId:'repair-'+state.step,context:false})
        },index*240)
      });
      setTimeout(()=>{
        addTransmission('source',task.prompt,{context:false,current:false})
      },Math.max(450,replayIds.length*240+150));
      return
    }

    if(state.failures===3 && task.remediation?.length){
      task.remediation.forEach((sig,index)=>{
        setTimeout(()=>{
          const id=addTransmission('source',sig,{
            bundleId:'contrast-'+state.step,
            context:true
          });
          if(task.concept){
            const saved=state.conceptContexts[task.concept]||[];
            if(!saved.includes(id))state.conceptContexts[task.concept]=[...saved,id]
          }
        },index*360)
      });
      setTimeout(()=>{
        addTransmission('source',task.prompt,{context:false,current:false})
      },task.remediation.length*360+450);
      return
    }

    addTransmission('source',task.prompt,{context:false,current:false})
  }

  function transmit(){
    const sent=trim(state.compose);
    const actual=sent.length?sent:[O];
    addTransmission('player',actual);
    clearComposer();

    const task=currentTask();
    if(!task)return;

    if(task.kind==='open'){
      if(sent.length===0){
        setTimeout(()=>remediation(task),450);
        return
      }

      state.signature=sent.slice();
      setTimeout(()=>{
        addTransmission('source',sent);
        setTimeout(reveal,1100)
      },500);
      return
    }

    if(same(sent,task.answer)){
      setTimeout(()=>correctResponse(sent),500)
    }else{
      setTimeout(()=>remediation(task),500)
    }
  }

  function reveal(){
    remembered.innerHTML='';
    remembered.appendChild(signalDOM(state.signature,'player'));
    overlay.classList.add('show')
  }

  function saveNote(){
    const tx=transmissionById(state.selectedId);
    const label=noteInput.value.trim();
    if(!tx||!label)return;

    state.notes.push({
      id:'n'+(state.notes.length+1),
      label,
      signal:tx.signal.slice(),
      side:tx.side
    });

    noteInput.value='';
    renderNotes()
  }

  function renderNotes(){
    notesEl.innerHTML='';
    state.notes.forEach(note=>{
      const el=document.createElement('button');
      el.type='button';
      el.className='note '+(note.side==='source'?'context-source':'context-player');

      const title=document.createElement('div');
      title.className='note-title';
      title.textContent=note.label;

      el.append(title,signalDOM(note.signal,note.side));
      el.addEventListener('click',()=>{
        scopeOrigin.textContent='RECORDED';
        scopeOrigin.className='scope-origin '+note.side;
        drawWave(note.signal,note.side,true)
      });

      notesEl.appendChild(el)
    })
  }

  ledger.addEventListener('scroll',()=>{
    const distance=ledger.scrollHeight-ledger.scrollTop-ledger.clientHeight;
    state.autoScroll=distance<60;
    if(state.autoScroll)incomingBtn.classList.remove('show')
  });

  incomingBtn.addEventListener('click',()=>{
    ledger.scrollTop=ledger.scrollHeight;
    state.autoScroll=true;
    incomingBtn.classList.remove('show')
  });

  scopePanel.addEventListener('click',()=>{
    if(state.selectedId)selectTransmission(state.selectedId,true)
  });

  clearBtn.addEventListener('click',clearComposer);
  sendBtn.addEventListener('click',transmit);

  document.getElementById('notebookBtn').addEventListener('click',()=>{
    notebook.classList.add('open');
    noteInput.focus()
  });

  document.getElementById('closeNotebook').addEventListener('click',()=>{
    notebook.classList.remove('open')
  });

  document.getElementById('saveNoteBtn').addEventListener('click',saveNote);
  noteInput.addEventListener('keydown',e=>{
    if(e.key==='Enter')saveNote()
  });

  document.getElementById('restartBtn').addEventListener('click',()=>location.reload());

  let deferredInstall=null;
  const installBtn=document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    deferredInstall=event;
    installBtn.classList.add('show')
  });

  installBtn.addEventListener('click',async()=>{
    if(!deferredInstall)return;
    deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall=null;
    installBtn.classList.remove('show')
  });

  window.addEventListener('appinstalled',()=>{
    installBtn.classList.remove('show');
    deferredInstall=null
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{})
    })
  }

  renderComposer();
  renderContext();
  drawNoise();
  setTimeout(presentTask,850)
})();
</script>
</body>
</html>
