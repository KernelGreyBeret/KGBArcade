<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#010302" />
<meta name="author" content="Tommy Burke / KGB Arcade" />
<meta name="copyright" content="Copyright © 2026 Tommy Burke / KGB Arcade. All rights reserved." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Asymmantics" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<title>Asymmantics — Beta</title>
<style>
  :root{
    --bg:#010302;
    --panel:#041008;
    --line:#14371d;
    --source:#67ff8f;
    --source-dim:#285d35;
    --player:#ffc96b;
    --player-dim:#66512b;
    --text:#c8ffd4;
    --muted:#4f7758;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    background:radial-gradient(circle at 50% 12%,#0a180e 0%,var(--bg) 64%,#000 100%);
    color:var(--text);font-family:"Courier New",monospace
  }
  button{font:inherit}
  .app{
    width:min(940px,100%);height:100dvh;margin:0 auto;padding:8px;
    display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px
  }
  .topbar{
    border:1px solid var(--line);background:rgba(1,7,3,.92);
    padding:10px 12px;color:var(--muted);letter-spacing:.16em;font-size:12px
  }
  .topbar strong{color:var(--source);font-weight:normal}
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .topbar-left{min-width:0}
  .install-btn{
    display:none;
    flex:0 0 auto;
    border:1px solid var(--source-dim);
    background:#07140b;
    color:var(--source);
    padding:7px 10px;
    letter-spacing:.12em;
    cursor:pointer;
  }
  .install-btn.show{display:block}
  .scope{
    height:92px;border:1px solid var(--line);
    background:
      linear-gradient(rgba(103,255,143,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(103,255,143,.018) 1px,transparent 1px),
      #020704;
    background-size:18px 18px;overflow:hidden
  }
  canvas{display:block;width:100%;height:92px}
  .ledger{
    min-height:0;overflow-y:auto;overscroll-behavior:contain;
    border:1px solid var(--line);background:rgba(1,7,3,.9);
    padding:12px 10px 18px;display:flex;flex-direction:column;gap:14px;
    scroll-behavior:smooth
  }
  .entry{display:flex;width:100%}
  .entry.source{justify-content:flex-start}
  .entry.player{justify-content:flex-end}
  .bubble{
    width:min(78%,620px);padding:10px 12px;min-height:54px;
    border:1px solid;background:#031008
  }
  .source .bubble{border-color:var(--source-dim);border-left:3px solid var(--source)}
  .player .bubble{
    border-color:var(--player-dim);border-right:3px solid var(--player);
    background:#100d05
  }
  .signal-line{
    min-height:34px;display:flex;align-items:center;flex-wrap:wrap;gap:0
  }
  .cell{width:22px;height:34px;position:relative;flex:0 0 22px}
  .cell.high::before,.cell.low::before{
    content:"";position:absolute;left:2px;width:18px;height:5px;border-radius:1px
  }
  .source .cell.high::before,.source .cell.low::before{
    background:var(--source);box-shadow:0 0 8px rgba(103,255,143,.28)
  }
  .player .cell.high::before,.player .cell.low::before{
    background:var(--player);box-shadow:0 0 8px rgba(255,201,107,.22)
  }
  .cell.high::before{top:5px}.cell.low::before{bottom:5px}
  .cell.high::after,.cell.low::after{
    content:"";position:absolute;left:10px;width:1px;height:19px;opacity:.32
  }
  .source .cell.high::after,.source .cell.low::after{background:var(--source)}
  .player .cell.high::after,.player .cell.low::after{background:var(--player)}
  .cell.high::after{top:10px}.cell.low::after{bottom:10px}
  .cell.off{width:26px;flex-basis:26px}
  .composer{
    border:1px solid var(--line);background:rgba(1,7,3,.96);
    padding:10px;display:grid;gap:9px
  }
  .strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
  .sigbtn{
    height:48px;border:1px solid #234a2c;background:#041008;
    color:var(--source);position:relative;cursor:pointer
  }
  .sigbtn::before{
    content:"";position:absolute;left:14%;right:14%;height:5px;border-radius:1px;opacity:0
  }
  .sigbtn.high::before{
    top:9px;opacity:1;background:var(--player);
    box-shadow:0 0 8px rgba(255,201,107,.22)
  }
  .sigbtn.low::before{
    bottom:9px;opacity:1;background:var(--player);
    box-shadow:0 0 8px rgba(255,201,107,.22)
  }
  .sigbtn.high::after,.sigbtn.low::after{
    content:"";position:absolute;left:50%;width:1px;height:22px;
    background:var(--player);opacity:.28
  }
  .sigbtn.high::after{top:14px}.sigbtn.low::after{bottom:14px}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .btn{
    border:1px solid #2a5734;background:#07140b;color:var(--text);
    padding:11px 10px;cursor:pointer;letter-spacing:.12em
  }
  .btn.primary{border-color:#5f512a;color:var(--player);background:#171106}
  .overlay{
    position:fixed;inset:0;z-index:20;display:none;place-items:center;
    padding:20px;background:#010301
  }
  .overlay.show{display:grid}
  .reveal{width:min(700px,100%);text-align:center}
  .entities{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px
  }
  .entity{
    height:112px;border:1px solid #294a31;display:grid;place-items:center;position:relative
  }
  .entity::before{
    content:"";width:18px;height:18px;border:2px solid var(--source);
    border-radius:50%;box-shadow:0 0 12px rgba(103,255,143,.35)
  }
  .entity.you{border-color:var(--player-dim)}
  .entity.you::before{
    border-color:var(--player);box-shadow:0 0 12px rgba(255,201,107,.28)
  }
  .entity.you::after{
    content:"";position:absolute;bottom:10px;width:44%;height:2px;background:var(--player)
  }
  .reveal-signal{display:flex;justify-content:center;margin:18px 0}
  .mark{
    margin-top:18px;color:var(--source);
    font-size:clamp(42px,10vw,92px);letter-spacing:.16em
  }
  .sub{margin-top:12px;color:var(--muted);letter-spacing:.14em;font-size:12px}
  @media(max-width:650px){
    .app{padding:5px;gap:5px}
    .scope{height:72px}canvas{height:72px}
    .ledger{padding:8px 6px 14px}
    .bubble{width:88%;padding:8px 9px}
    .strip{gap:3px}.sigbtn{height:42px}
    .cell{width:18px;flex-basis:18px}
    .cell.off{width:22px;flex-basis:22px}
    .cell.high::before,.cell.low::before{width:14px;left:2px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">ASYMMANTICS // BETA <strong id="stateMark">•</strong></div>
    <button type="button" class="install-btn" id="installBtn">INSTALL</button>
  </header>
  <section class="scope">
    <canvas id="scope" width="900" height="92" aria-label="Last transmitted signal waveform"></canvas>
  </section>
  <main class="ledger" id="ledger" aria-live="polite"></main>
  <section class="composer">
    <div class="strip" id="strip"></div>
    <div class="controls">
      <button type="button" class="btn" id="clearBtn">CLEAR</button>
      <button type="button" class="btn primary" id="sendBtn">TRANSMIT</button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="reveal">
    <div class="entities">
      <div class="entity"></div>
      <div class="entity"></div>
      <div class="entity you"></div>
    </div>
    <div class="reveal-signal" id="remembered"></div>
    <div class="mark">ASYMMANTICS</div>
    <div class="sub">PRESENCE ESTABLISHED</div>
    <button type="button" class="btn primary" id="restartBtn" style="margin-top:24px">RESTART</button>
  </div>
</div>

<script>
(() => {
  const ledger=document.getElementById('ledger');
  const strip=document.getElementById('strip');
  const clearBtn=document.getElementById('clearBtn');
  const sendBtn=document.getElementById('sendBtn');
  const overlay=document.getElementById('overlay');
  const remembered=document.getElementById('remembered');
  const stateMark=document.getElementById('stateMark');
  const canvas=document.getElementById('scope');
  const ctx=canvas.getContext('2d');

  const O=0,H=1,L=-1;
  const SAME=[H,L,H];
  const DIFFERENT=[L,H,L];

  const state={
    compose:Array(12).fill(O),
    step:0,
    signature:[],
    lastSignal:[],
    lastSide:'source',
  };

  const tasks=[
    {kind:'progress',prompt:groups([H],[H,H],[H,H,H]),answer:[H,H,H,H]},
    {kind:'progress',prompt:groups([L,L],[L,L,L],[L,L,L,L]),answer:[L,L,L,L,L]},
    {kind:'progress',prompt:groups([H,L],[H,L,H,L],[H,L,H,L,H,L]),answer:[H,L,H,L,H,L,H,L]},
    {kind:'echo',prompt:[H,L,H,H,L,H],answer:[H,L,H,H,L,H]},
    {kind:'echo',prompt:[L,H,O,H,L,H,O,L],answer:[L,H,O,H,L,H,O,L]},

    {kind:'demonstrate',prompt:groups([H,L,H],[H,L,H],SAME)},
    {kind:'demonstrate',prompt:groups([L,L,H],[L,L,H],SAME)},
    {kind:'demonstrate',prompt:groups([H,L,H],[L,H,H],DIFFERENT)},
    {kind:'demonstrate',prompt:groups([L,H,H],[H,L,H],DIFFERENT)},

    {kind:'relation',prompt:groups([H,H,L,H],[H,H,L,H]),answer:SAME},
    {kind:'relation',prompt:groups([H,H,L],[H,L,H]),answer:DIFFERENT},
    {kind:'relation',prompt:groups([H,O,L,H],[H,O,L,H]),answer:SAME},

    {kind:'progress',prompt:groups([L],[L,L],[L,L,L],[L,L,L,L]),answer:[L,L,L,L,L]},
    {kind:'echo',prompt:[H,O,L,L,H,O,H,L],answer:[H,O,L,L,H,O,H,L]},
    {kind:'relation',prompt:groups([L,H,O,L],[L,H,L,O]),answer:DIFFERENT},

    {kind:'open',prompt:[H,H,H,L,L,L,H,H,H]}
  ];

  function trim(a){
    let e=a.length;
    while(e>0&&a[e-1]===O)e--;
    return a.slice(0,e);
  }

  function same(a,b){
    const x=trim(a),y=trim(b);
    return x.length===y.length&&x.every((v,i)=>v===y[i]);
  }

  function groups(...gs){
    const out=[];
    gs.forEach((g,i)=>{
      out.push(...g);
      if(i<gs.length-1)out.push(O,O);
    });
    return out;
  }

  function signalDOM(signal){
    const line=document.createElement('div');
    line.className='signal-line';
    signal.forEach(v=>{
      const c=document.createElement('span');
      c.className='cell '+(v===H?'high':v===L?'low':'off');
      line.appendChild(c);
    });
    return line;
  }

  function addEntry(side,signal){
    const row=document.createElement('div');
    row.className='entry '+side;
    const bubble=document.createElement('div');
    bubble.className='bubble';
    bubble.appendChild(signalDOM(signal));
    row.appendChild(bubble);
    ledger.appendChild(row);

    state.lastSignal=signal.slice();
    state.lastSide=side;
    drawWave();
    requestAnimationFrame(()=>ledger.scrollTop=ledger.scrollHeight);
  }

  function renderComposer(){
    strip.innerHTML='';
    state.compose.forEach((v,i)=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='sigbtn '+(v===H?'high':v===L?'low':'off');
      b.setAttribute('aria-label','Signal position '+(i+1));
      b.addEventListener('click',()=>{
        state.compose[i]=v===O?H:v===H?L:O;
        renderComposer();
      });
      strip.appendChild(b);
    });
  }

  function clearComposer(){
    state.compose=Array(12).fill(O);
    renderComposer();
  }

  function drawWave(){
    cancelAnimationFrame(drawWave.raf);
    const sig=state.lastSignal.length?state.lastSignal:[O];
    const color=state.lastSide==='source'
      ?'rgba(103,255,143,.88)'
      :'rgba(255,201,107,.88)';

    ctx.clearRect(0,0,canvas.width,canvas.height);
    const pad=20,mid=canvas.height/2,amp=canvas.height*.27;
    const step=(canvas.width-pad*2)/Math.max(sig.length,1);

    ctx.strokeStyle='rgba(103,255,143,.08)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(canvas.width,mid);ctx.stroke();

    ctx.strokeStyle=color;
    ctx.lineWidth=2;
    ctx.beginPath();
    let x=pad,y=mid;
    ctx.moveTo(x,y);

    sig.forEach((v,i)=>{
      const target=v===H?mid-amp:v===L?mid+amp:mid;
      const nx=pad+(i+1)*step;
      ctx.lineTo(x,target);
      ctx.lineTo(nx,target);
      x=nx;y=target;
    });

    ctx.lineTo(canvas.width-pad,mid);
    ctx.stroke();
  }

  function pulseError(){
    stateMark.textContent='••';
    setTimeout(()=>stateMark.textContent='•',450);
  }

  function currentTask(){return tasks[state.step]}

  function presentTask(){
    const t=currentTask();
    if(!t)return;
    addEntry('source',t.prompt);

    if(t.kind==='demonstrate'){
      setTimeout(()=>{
        state.step++;
        presentTask();
      },1150);
    }
  }

  function confirm(received){
    addEntry('source',received);
  }

  function retry(){
    pulseError();
    const t=currentTask();
    addEntry('source',t.prompt);
  }

  function transmit(){
    const sent=trim(state.compose);
    addEntry('player',sent.length?sent:[O]);
    clearComposer();

    const t=currentTask();
    if(!t)return;

    if(t.kind==='open'){
      if(sent.length===0){
        setTimeout(()=>addEntry('source',t.prompt),500);
        return;
      }

      state.signature=sent.slice();
      setTimeout(()=>{
        addEntry('source',sent);
        setTimeout(reveal,1200);
      },550);
      return;
    }

    const correct=same(sent,t.answer);

    setTimeout(()=>{
      if(correct){
        confirm(sent);
        state.step++;
        setTimeout(presentTask,950);
      }else{
        retry();
      }
    },500);
  }

  function reveal(){
    remembered.innerHTML='';
    remembered.appendChild(signalDOM(state.signature));
    overlay.classList.add('show');
  }

  clearBtn.addEventListener('click',clearComposer);
  sendBtn.addEventListener('click',transmit);
  document.getElementById('restartBtn').addEventListener('click',()=>location.reload());

  renderComposer();
  drawWave();
  setTimeout(presentTask,850);

  const installBtn=document.getElementById('installBtn');
  let deferredInstall=null;

  window.addEventListener('beforeinstallprompt',(event)=>{
    event.preventDefault();
    deferredInstall=event;
    installBtn.classList.add('show');
  });

  installBtn.addEventListener('click',async()=>{
    if(!deferredInstall)return;
    deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall=null;
    installBtn.classList.remove('show');
  });

  window.addEventListener('appinstalled',()=>{
    installBtn.classList.remove('show');
    deferredInstall=null;
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
